# Contrato de entrada a nivel de bloque, mismo formato que spec_example.yaml
# pero para una mariposa FFT radix-4. Se pasa como argumento a
# orchestrator.py (por defecto usa spec_example.yaml si no se indica ruta).

bloque: fft_radix4
descripcion: >
  Kernel de una mariposa FFT radix-4 (Cooley-Tukey), entrada compleja de N
  puntos, salida compleja de N puntos. Misma forma de E/S que la variante
  radix-2 ya validada, pero con mariposas de 4 entradas en vez de 2 -- misma
  familia de algoritmo, dificultad de implementación comparable.

entradas:
  - nombre: x_real
    tipo: allo.float32
    forma: [1024]
  - nombre: x_imag
    tipo: allo.float32
    forma: [1024]

salidas:
  - nombre: y_real
    tipo: allo.float32
    forma: [1024]
  - nombre: y_imag
    tipo: allo.float32
    forma: [1024]

# La función envuelve np.fft.fft sobre la señal compleja reconstruida y es
# agnóstica al radix usado internamente por el kernel -- ver golden_models.py.
golden_model_id: fft_numpy_reference

restricciones:
  objetivo_ii: 5             # initiation interval objetivo para la síntesis HLS
  throughput_min: 100e6      # muestras/segundo
