# Ejemplo de "contrato de entrada a nivel de bloque" (ver correo del proyecto).
# Esto es lo que recibe el agente Generador para escribir el kernel Allo.

bloque: fft_radix2
descripcion: >
  Kernel de una mariposa FFT radix-2 (Cooley-Tukey), entrada compleja de N
  puntos, salida compleja de N puntos.

entradas:
  - nombre: x_real
    tipo: allo.float32
    forma: [1024]
  - nombre: x_imag
    tipo: allo.float32
    forma: [1024]

salidas:
  - nombre: y_real
    tipo: allo.float32
    forma: [1024]
  - nombre: y_imag
    tipo: allo.float32
    forma: [1024]

golden_model_id: fft_radix2_numpy_reference

restricciones:
  objetivo_ii: 5            # bajado desde 10 (24 de septiembre de 2026):
                            # segundo punto del mismo barrido de objetivo_ii
                            # para la curva rendimiento/area del TFG (20 -> 10
                            # -> 5). El resultado de II=10 (Partition.Cyclic,
                            # factor=4, confirmado real en
                            # src/agentes/probar_particion_ii.py) ya esta
                            # respaldado en
                            # results/catalogo/fft_radix2_ii10.json antes de
                            # este cambio, porque guardar_en_catalogo()
                            # sobreescribe por nombre de bloque. Paso
                            # conservador (10 -> 5, no directo a 1) por la
                            # misma razon que el paso anterior: objetivo_ii=1
                            # ya causo timeouts de sintesis repetidos en
                            # corridas anteriores (ver Parte 9 de la
                            # bitacora).
  throughput_min: 100e6   # muestras/segundo
